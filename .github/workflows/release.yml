name: release

# Runs GoReleaser on every pushed semver tag (git tag v1.2.3 && git push --tags),
# then rebuilds the signed apt repository on GitHub Pages from that release.
#
# Also dispatchable against a tag ref: a tag push is a one-shot event, and if
# Actions drops it nothing reports an error.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # id-token for cosign keyless signing (the signature is bound to this
    # workflow's identity, so there is no key to leak); contents: write for
    # the release itself.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      # bun builds the viewer assets the before-hook embeds.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Run tests
        run: go test -race ./...
      # cosign 2.6.5: new enough to verify goreleaser's sigstore-bundle
      # checksums, old enough to keep the --output-certificate/--output-signature
      # flags the signs stanza uses (3.x dropped them).
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.18.1"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signed APT repository on GitHub Pages, so `apt install kb` and
  # `apt upgrade` track releases. Stateless: rebuilt from this release's debs
  # only (older versions stay on GitHub Releases). Needs the APT_SIGNING_KEY
  # secret (armored private key) and Pages enabled.
  apt-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install apt repository tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
      - name: Download this release's debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" -p '*.deb' -D debs
      - name: Import the repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY secret is not set; refusing to publish an unsigned repo"
            exit 1
          fi
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
      # A rotated or mistyped secret would publish a repo every installed
      # client rejects with a bad signature. Compare against the public key
      # pinned in the repository, where a mismatch is still a red build.
      - name: Check the key against the pinned fingerprint
        run: |
          if [ ! -s packaging/apt-signing-key.asc ]; then
            echo "::error::packaging/apt-signing-key.asc is missing; commit the public half of APT_SIGNING_KEY"
            exit 1
          fi
          pinned=$(gpg --show-keys --with-colons packaging/apt-signing-key.asc | awk -F: '/^fpr:/ {print $10; exit}')
          imported=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ "$pinned" != "$imported" ]; then
            echo "::error::APT_SIGNING_KEY holds $imported but packaging/apt-signing-key.asc pins $pinned"
            exit 1
          fi
      - name: Build the signed repository
        run: .github/scripts/build-apt-repo.sh debs site
      - name: Verify the repository with apt
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/aptroot"
          mkdir -p "$A"/{etc/apt/sources.list.d,etc/apt/trusted.gpg.d,etc/apt/preferences.d,var/lib/apt/lists/partial,var/cache/apt/archives/partial,var/lib/dpkg}
          touch "$A/var/lib/dpkg/status"
          cp site/kb-archive-keyring.gpg "$A/etc/apt/trusted.gpg.d/kb.gpg"
          echo "deb [signed-by=$A/etc/apt/trusted.gpg.d/kb.gpg arch=arm64] file://$PWD/site stable main" \
            > "$A/etc/apt/sources.list.d/kb.list"
          opts=(-o "Dir=$A" -o "Dir::State=$A/var/lib/apt"
                -o "Dir::State::status=$A/var/lib/dpkg/status"
                -o "Dir::Cache=$A/var/cache/apt"
                -o "Dir::Etc::sourcelist=$A/etc/apt/sources.list.d/kb.list"
                -o "Dir::Etc::sourceparts=-"
                -o "Dir::Etc::trusted.gpg.d=$A/etc/apt/trusted.gpg.d"
                -o "APT::Architecture=arm64")
          apt-get "${opts[@]}" update
          apt-cache "${opts[@]}" policy kb
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
